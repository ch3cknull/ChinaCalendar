name: Validate generated calendars

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest generator.tests -v
      - run: uv run --frozen python -m generator --check
